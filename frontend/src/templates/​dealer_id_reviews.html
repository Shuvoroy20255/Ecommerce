<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dealer List</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #007bff; color: white; padding: 12px; }
        td { border: 1px solid #ddd; padding: 10px; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <h2>Best Car Dealers</h2>
    <table>
        <thead>
            <tr>
                <th>Dealer Name</th>
                <th>ID</th>
                <th>City</th>
                <th>Address</th>
                <th>ZIP</th>
                <th>State</th>
            </tr>
        </thead>
        <tbody>
            {% for dealer in dealers %}
            <tr>
                <td>{{ dealer.full_name }}</td>
                <td>{{ dealer.id }}</td>
                <td>{{ dealer.city }}</td>
                <td>{{ dealer.address }}</td>
                <td>{{ dealer.zip }}</td>
                <td>{{ dealer.st }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
