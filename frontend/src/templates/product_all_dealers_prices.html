<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dealer List</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Dealer List</h2>
    <table>
        <thead>
            <tr>
                <th>Dealer Name</th>
                <th>ID</th>
                <th>City</th>
                <th>Address</th>
                <th>ZIP</th>
                <th>State</th>
            </tr>
        </thead>
        <tbody>
            {% for dealer in dealers %}
            <tr>
                <td>{{ dealer.full_name }}</td>
                <td>{{ dealer.id }}</td>
                <td>{{ dealer.city }}</td>
                <td>{{ dealer.address }}</td>
                <td>{{ dealer.zip }}</td>
                <td>{{ dealer.st }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
